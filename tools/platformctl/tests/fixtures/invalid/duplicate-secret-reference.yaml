apiVersion: idp/v1alpha1
kind: PlatformService
metadata:
  name: duplicate-secret-api
  owner: platform-team
spec:
  image:
    repository: registry.test/platform/duplicate-secret-api
    digest: sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
  runtime:
    port: 8080
    healthPath: /healthz
  resources:
    profile: small
  availability:
    profile: single
  secrets:
    envFrom:
      - shared-runtime
      - shared-runtime
