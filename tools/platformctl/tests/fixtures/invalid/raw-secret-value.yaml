apiVersion: idp/v1alpha1
kind: PlatformService
metadata:
  name: raw-secret-api
  owner: platform-team
spec:
  image:
    repository: registry.test/platform/raw-secret-api
    digest: sha256:6666666666666666666666666666666666666666666666666666666666666666
  runtime:
    port: 8080
    healthPath: /healthz
  resources:
    profile: small
  availability:
    profile: single
  secrets:
    envFrom:
      - shared-runtime
    inlineValue: should-not-be-here
