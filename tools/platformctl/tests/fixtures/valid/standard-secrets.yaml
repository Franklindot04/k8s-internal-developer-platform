apiVersion: idp/v1alpha1
kind: PlatformService
metadata:
  name: orders-api
  owner: commerce-team
  description: Valid service intent with existing Secret references.
spec:
  image:
    repository: registry.test/platform/orders-api
    digest: sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
  runtime:
    port: 9000
    healthPath: /status
  resources:
    profile: large
  availability:
    profile: standard
  secrets:
    envFrom:
      - orders-runtime
      - shared-runtime
