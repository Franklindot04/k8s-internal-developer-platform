[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "platformctl"
version = "0.1.0"
description = "Repository-local PlatformService validation tooling."
requires-python = ">=3.12"
dependencies = [
  "jsonschema==4.26.0",
  "PyYAML==6.0.3"
]

[project.scripts]
platformctl = "platformctl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
