name: Trusted image publication

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: trusted-image-publication
  queue: max

jobs:
  scope:
    name: Trusted publication scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      trusted-publication: ${{ steps.scope.outputs.trusted-publication }}
    steps:
      # actions/checkout v7.0.1
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Classify trusted publication scope
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          changed_paths="$RUNNER_TEMP/trusted-publication-changed-paths.txt"
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            git show --format='' --name-only "${{ github.sha }}" >"$changed_paths"
          else
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" >"$changed_paths"
          fi
          relevant="$(bash scripts/ci/workflow-scope.sh trusted-publication "$changed_paths")"
          printf 'trusted-publication=%s\n' "$relevant" >>"$GITHUB_OUTPUT"
          {
            printf '### Trusted publication scope\n'
            printf -- '- trusted-publication: `%s`\n' "$relevant"
          } >>"$GITHUB_STEP_SUMMARY"

  candidate:
    name: Trusted candidate verification
    needs:
      - scope
    if: ${{ needs.scope.outputs.trusted-publication == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      status: ${{ steps.candidate.outputs.status }}
      mode: ${{ steps.candidate.outputs.mode }}
      artifact-name: ${{ steps.candidate.outputs.artifact-name }}
      artifact-path: ${{ steps.candidate.outputs.artifact-path }}
      candidate-repository: ${{ steps.candidate.outputs.candidate-repository }}
      candidate-tag: ${{ steps.candidate.outputs.candidate-tag }}
      candidate-digest: ${{ steps.candidate.outputs.candidate-digest }}
      candidate-visibility: ${{ steps.candidate.outputs.candidate-visibility }}
      local-policy-decision: ${{ steps.candidate.outputs.local-policy-decision }}
      policy-decision: ${{ steps.candidate.outputs.policy-decision }}
      authoritative-repository: ${{ steps.candidate.outputs.authoritative-repository }}
      authoritative-tag: ${{ steps.candidate.outputs.authoritative-tag }}
      authoritative-digest: ${{ steps.candidate.outputs.authoritative-digest }}
      authoritative-visibility: ${{ steps.candidate.outputs.authoritative-visibility }}
      evidence-upload-allowed: ${{ steps.candidate.outputs.evidence-upload-allowed }}
    steps:
      # actions/checkout v7.0.1
      - name: Check out trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Run local quarantine and candidate verification
        id: candidate
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work_dir="$RUNNER_TEMP/trusted-publication-candidate"
          result_file="$work_dir/result.env"
          mkdir -p "$work_dir"

          set +e
          TRUSTED_PUBLICATION_WORK_DIR="$work_dir" \
            TRUSTED_PUBLICATION_RESULT_FILE="$result_file" \
            bash scripts/supply-chain/trusted-publication.sh candidate
          publication_exit="$?"
          set -e

          if [ -f "$result_file" ]; then
            # shellcheck disable=SC1090
            . "$result_file"
          else
            status="failure"
            mode="unknown"
            evidence_upload_allowed="false"
            artifact_name=""
            candidate_repository=""
            candidate_tag=""
            candidate_digest=""
            candidate_visibility=""
            local_policy_decision=""
            policy_decision=""
            authoritative_repository=""
            authoritative_tag=""
            authoritative_digest=""
            authoritative_visibility=""
          fi

          {
            printf 'status=%s\n' "$status"
            printf 'mode=%s\n' "$mode"
            printf 'artifact-name=%s\n' "$artifact_name"
            printf 'candidate-repository=%s\n' "$candidate_repository"
            printf 'candidate-tag=%s\n' "$candidate_tag"
            printf 'candidate-digest=%s\n' "$candidate_digest"
            printf 'candidate-visibility=%s\n' "$candidate_visibility"
            printf 'local-policy-decision=%s\n' "$local_policy_decision"
            printf 'policy-decision=%s\n' "$policy_decision"
            printf 'authoritative-repository=%s\n' "$authoritative_repository"
            printf 'authoritative-tag=%s\n' "$authoritative_tag"
            printf 'authoritative-digest=%s\n' "$authoritative_digest"
            printf 'authoritative-visibility=%s\n' "$authoritative_visibility"
            printf 'evidence-upload-allowed=%s\n' "$evidence_upload_allowed"
            printf 'artifact-path=%s\n' "$work_dir/artifact"
          } >>"$GITHUB_OUTPUT"

          {
            printf '### Trusted candidate verification\n'
            printf -- '- source revision: `%s`\n' "${GITHUB_SHA}"
            printf -- '- publication mode: `%s`\n' "$mode"
            printf -- '- candidate repository: `%s`\n' "$candidate_repository"
            printf -- '- candidate tag: `%s`\n' "$candidate_tag"
            printf -- '- candidate digest: `%s`\n' "$candidate_digest"
            printf -- '- candidate visibility: `%s`\n' "$candidate_visibility"
            printf -- '- local policy result: `%s`\n' "$local_policy_decision"
            printf -- '- registry policy result: `%s`\n' "$policy_decision"
            printf -- '- evidence artifact: `%s`\n' "$artifact_name"
          } >>"$GITHUB_STEP_SUMMARY"

          exit "$publication_exit"

      # actions/upload-artifact v7.0.1
      - name: Upload candidate evidence
        if: ${{ always() && steps.candidate.outputs.evidence-upload-allowed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.candidate.outputs.artifact-name }}
          path: ${{ steps.candidate.outputs.artifact-path }}/*
          if-no-files-found: error
          retention-days: 90

  authoritative:
    name: Authoritative image publication
    needs:
      - candidate
    if: ${{ needs.candidate.outputs.mode == 'candidate' && needs.candidate.outputs.status == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    environment: authoritative-publication
    outputs:
      status: ${{ steps.authoritative.outputs.status }}
      artifact-name: ${{ steps.authoritative.outputs.artifact-name }}
      authoritative-repository: ${{ steps.authoritative.outputs.authoritative-repository }}
      authoritative-tag: ${{ steps.authoritative.outputs.authoritative-tag }}
      authoritative-digest: ${{ steps.authoritative.outputs.authoritative-digest }}
      authoritative-visibility: ${{ steps.authoritative.outputs.authoritative-visibility }}
      evidence-upload-allowed: ${{ steps.authoritative.outputs.evidence-upload-allowed }}
    steps:
      # actions/checkout v7.0.1
      - name: Check out trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      # actions/download-artifact v8.0.1
      - name: Download candidate evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: ${{ needs.candidate.outputs.artifact-name }}
          path: ${{ runner.temp }}/trusted-publication-authoritative/download

      - name: Run authoritative publication
        id: authoritative
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TRUSTED_PUBLICATION_CANDIDATE_EVIDENCE: ${{ runner.temp }}/trusted-publication-authoritative/download/publication-evidence.json
        run: |
          set -euo pipefail
          work_dir="$RUNNER_TEMP/trusted-publication-authoritative"
          result_file="$work_dir/result.env"
          mkdir -p "$work_dir"

          set +e
          TRUSTED_PUBLICATION_WORK_DIR="$work_dir" \
            TRUSTED_PUBLICATION_RESULT_FILE="$result_file" \
            bash scripts/supply-chain/trusted-publication.sh authoritative
          publication_exit="$?"
          set -e

          if [ -f "$result_file" ]; then
            # shellcheck disable=SC1090
            . "$result_file"
          else
            status="failure"
            evidence_upload_allowed="false"
            artifact_name=""
            authoritative_repository=""
            authoritative_tag=""
            authoritative_digest=""
            authoritative_visibility=""
          fi

          {
            printf 'status=%s\n' "$status"
            printf 'artifact-name=%s\n' "$artifact_name"
            printf 'authoritative-repository=%s\n' "$authoritative_repository"
            printf 'authoritative-tag=%s\n' "$authoritative_tag"
            printf 'authoritative-digest=%s\n' "$authoritative_digest"
            printf 'authoritative-visibility=%s\n' "$authoritative_visibility"
            printf 'evidence-upload-allowed=%s\n' "$evidence_upload_allowed"
            printf 'artifact-path=%s\n' "$work_dir/artifact"
          } >>"$GITHUB_OUTPUT"

          {
            printf '### Authoritative image publication\n'
            printf -- '- authoritative repository: `%s`\n' "$authoritative_repository"
            printf -- '- authoritative tag: `%s`\n' "$authoritative_tag"
            printf -- '- authoritative digest: `%s`\n' "$authoritative_digest"
            printf -- '- authoritative visibility: `%s`\n' "$authoritative_visibility"
            printf -- '- evidence artifact: `%s`\n' "$artifact_name"
          } >>"$GITHUB_STEP_SUMMARY"

          exit "$publication_exit"

      # actions/upload-artifact v7.0.1
      - name: Upload authoritative evidence
        if: ${{ always() && steps.authoritative.outputs.evidence-upload-allowed == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ steps.authoritative.outputs.artifact-name }}
          path: ${{ steps.authoritative.outputs.artifact-path }}/*
          if-no-files-found: error
          retention-days: 90

  final-report:
    name: Trusted publication validation
    needs:
      - scope
      - candidate
      - authoritative
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Enforce trusted publication result
        shell: bash
        run: |
          set -euo pipefail
          scope_result="${{ needs.scope.result }}"
          publication_scope="${{ needs.scope.outputs.trusted-publication }}"
          candidate_result="${{ needs.candidate.result }}"
          candidate_status="${{ needs.candidate.outputs.status }}"
          candidate_mode="${{ needs.candidate.outputs.mode }}"
          authoritative_result="${{ needs.authoritative.result }}"
          authoritative_status="${{ needs.authoritative.outputs.status }}"

          {
            printf '### Trusted publication validation\n'
            printf -- '- publication scope: `%s`\n' "$publication_scope"
            printf -- '- candidate job result: `%s`\n' "$candidate_result"
            printf -- '- candidate status: `%s`\n' "$candidate_status"
            printf -- '- candidate mode: `%s`\n' "$candidate_mode"
            printf -- '- authoritative job result: `%s`\n' "$authoritative_result"
            printf -- '- authoritative status: `%s`\n' "$authoritative_status"
          } >>"$GITHUB_STEP_SUMMARY"

          if [ "$scope_result" != "success" ]; then
            printf '[error] trusted publication scope failed\n' >&2
            exit 1
          fi
          if [ "$publication_scope" = "false" ]; then
            printf '[ok] trusted publication not required for this main push\n'
            exit 0
          fi
          if [ "$publication_scope" != "true" ]; then
            printf '[error] unknown trusted publication scope result\n' >&2
            exit 1
          fi
          if [ "$candidate_result" != "success" ] || [ "$candidate_status" != "success" ]; then
            printf '[error] candidate verification failed or was canceled\n' >&2
            exit 1
          fi
          if [ "$candidate_mode" = "existing" ]; then
            printf '[ok] existing authoritative publication verified\n'
            exit 0
          fi
          if [ "$candidate_mode" != "candidate" ]; then
            printf '[error] unknown trusted publication mode\n' >&2
            exit 1
          fi
          if [ "$authoritative_result" != "success" ] || [ "$authoritative_status" != "success" ]; then
            printf '[error] authoritative publication failed, was canceled, or was not approved\n' >&2
            exit 1
          fi
          printf '[ok] trusted publication passed\n'
