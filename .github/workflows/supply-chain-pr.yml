name: Supply-chain PR verification

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  scope:
    name: Supply-chain PR scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run-runtime: ${{ steps.classify.outputs.run-runtime }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Classify supply-chain PR scope
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_MERGE_SHA: ${{ github.sha }}
        run: |
          git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" "$PR_MERGE_SHA" >"$RUNNER_TEMP/changed-files.txt"
          run_runtime="$(scripts/ci/workflow-scope.sh supply-chain-pr "$RUNNER_TEMP/changed-files.txt")"
          printf 'run-runtime=%s\n' "$run_runtime" >>"$GITHUB_OUTPUT"
          printf '[info] Supply-chain PR execution required: %s\n' "$run_runtime"

  supply-chain-pr-execution:
    name: Supply-chain PR execution
    needs: scope
    if: ${{ needs.scope.outputs.run-runtime == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_REPOSITORY: ${{ github.repository }}
      SOURCE_REVISION: ${{ github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_MERGE_SHA: ${{ github.sha }}
      WORKFLOW_RUN_ID: ${{ github.run_id }}
      WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
      EVIDENCE_DIR: .tmp/supply-chain-evidence
      IMAGE_ARTIFACT_NAME: supply-chain-image-pr-${{ github.event.pull_request.number }}-run-${{ github.run_id }}
      EVIDENCE_ARTIFACT_NAME: supply-chain-evidence-pr-${{ github.event.pull_request.number }}-run-${{ github.run_id }}
      IMAGE_ARCHIVE_MAX_BYTES: "52428800"
      EVIDENCE_MAX_BYTES: "10485760"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify checked-out source identity
        run: |
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$PR_MERGE_SHA" ]; then
            printf '[error] checked-out source is %s, expected PR merge SHA %s\n' "$actual" "$PR_MERGE_SHA" >&2
            exit 1
          fi
          printf '[ok] build source merge SHA: %s\n' "$actual"
          printf '[info] PR base SHA: %s\n' "$PR_BASE_SHA"
          printf '[info] PR head SHA: %s\n' "$PR_HEAD_SHA"

      - name: Show Docker build environment
        run: |
          docker version --format 'Docker server version: {{.Server.Version}}'
          docker buildx version
          docker buildx ls

      - name: Clean supply-chain evidence state
        run: rm -rf .tmp/supply-chain-evidence .tmp/supply-chain-tools "$RUNNER_TEMP/supply-chain-pr-artifacts"

      - name: Run supply-chain evidence
        id: evidence_run
        continue-on-error: true
        run: make supply-chain-evidence

      - name: Validate generated evidence
        id: evidence_validation
        if: ${{ always() }}
        run: |
          if ruby scripts/supply-chain/validate-evidence.rb validate \
            --evidence-dir "$EVIDENCE_DIR" \
            --versions-file scripts/supply-chain/versions.env; then
            printf 'validated=true\n' >>"$GITHUB_OUTPUT"
            printf '[ok] validated evidence is available for retention\n'
          else
            printf 'validated=false\n' >>"$GITHUB_OUTPUT"
            printf '[error] validated evidence is not available for retention\n' >&2
          fi

      - name: Guard artifact sizes
        id: size_guard
        if: ${{ always() && steps.evidence_validation.outputs.validated == 'true' }}
        run: |
          archive="$EVIDENCE_DIR/supply-chain-fixture.tar"
          evidence_files="
          $EVIDENCE_DIR/artifact-sha256.txt
          $EVIDENCE_DIR/runtime-source-archive-sha256.txt
          $EVIDENCE_DIR/built-image-id.txt
          $EVIDENCE_DIR/loaded-image-id.txt
          $EVIDENCE_DIR/pre-load-image-removal.txt
          $EVIDENCE_DIR/sbom-sha256.txt
          $EVIDENCE_DIR/sbom-syft-sha256.txt
          $EVIDENCE_DIR/vulnerabilities-sha256.txt
          $EVIDENCE_DIR/sbom.cdx.json
          $EVIDENCE_DIR/sbom.syft.json
          $EVIDENCE_DIR/vulnerabilities.json
          $EVIDENCE_DIR/policy-result.json
          $EVIDENCE_DIR/evidence-manifest.json
          $EVIDENCE_DIR/evidence-manifest.json.sha256
          "
          archive_size="$(wc -c <"$archive" | tr -d ' ')"
          if [ "$archive_size" -gt "$IMAGE_ARCHIVE_MAX_BYTES" ]; then
            printf '[error] image archive size %s exceeds limit %s\n' "$archive_size" "$IMAGE_ARCHIVE_MAX_BYTES" >&2
            exit 1
          fi

          evidence_size=0
          for file in $evidence_files; do
            [ -f "$file" ] || { printf '[error] expected evidence file missing: %s\n' "$file" >&2; exit 1; }
            size="$(wc -c <"$file" | tr -d ' ')"
            evidence_size=$((evidence_size + size))
          done
          if [ "$evidence_size" -gt "$EVIDENCE_MAX_BYTES" ]; then
            printf '[error] compact evidence size %s exceeds limit %s\n' "$evidence_size" "$EVIDENCE_MAX_BYTES" >&2
            exit 1
          fi
          printf 'archive-size=%s\n' "$archive_size" >>"$GITHUB_OUTPUT"
          printf 'evidence-size=%s\n' "$evidence_size" >>"$GITHUB_OUTPUT"
          printf '[ok] image archive size: %s bytes\n' "$archive_size"
          printf '[ok] compact evidence size: %s bytes\n' "$evidence_size"

      - name: Stage validated artifacts
        id: stage_artifacts
        if: ${{ always() && steps.evidence_validation.outputs.validated == 'true' && steps.size_guard.outcome == 'success' }}
        run: |
          image_dir="$RUNNER_TEMP/supply-chain-pr-artifacts/image"
          evidence_dir="$RUNNER_TEMP/supply-chain-pr-artifacts/evidence"
          mkdir -p "$image_dir" "$evidence_dir"

          cp "$EVIDENCE_DIR/supply-chain-fixture.tar" "$image_dir/supply-chain-fixture.tar"
          cp "$EVIDENCE_DIR/artifact-sha256.txt" "$evidence_dir/artifact-sha256.txt"
          cp "$EVIDENCE_DIR/runtime-source-archive-sha256.txt" "$evidence_dir/runtime-source-archive-sha256.txt"
          cp "$EVIDENCE_DIR/built-image-id.txt" "$evidence_dir/built-image-id.txt"
          cp "$EVIDENCE_DIR/loaded-image-id.txt" "$evidence_dir/loaded-image-id.txt"
          cp "$EVIDENCE_DIR/pre-load-image-removal.txt" "$evidence_dir/pre-load-image-removal.txt"
          cp "$EVIDENCE_DIR/sbom-sha256.txt" "$evidence_dir/sbom-sha256.txt"
          cp "$EVIDENCE_DIR/sbom-syft-sha256.txt" "$evidence_dir/sbom-syft-sha256.txt"
          cp "$EVIDENCE_DIR/vulnerabilities-sha256.txt" "$evidence_dir/vulnerabilities-sha256.txt"
          cp "$EVIDENCE_DIR/sbom.cdx.json" "$evidence_dir/sbom.cdx.json"
          cp "$EVIDENCE_DIR/sbom.syft.json" "$evidence_dir/sbom.syft.json"
          cp "$EVIDENCE_DIR/vulnerabilities.json" "$evidence_dir/vulnerabilities.json"
          cp "$EVIDENCE_DIR/policy-result.json" "$evidence_dir/policy-result.json"
          cp "$EVIDENCE_DIR/evidence-manifest.json" "$evidence_dir/evidence-manifest.json"
          cp "$EVIDENCE_DIR/evidence-manifest.json.sha256" "$evidence_dir/evidence-manifest.json.sha256"

          expected="$(cat "$EVIDENCE_DIR/artifact-sha256.txt")"
          actual="$(sha256sum "$image_dir/supply-chain-fixture.tar" | awk '{ print $1 }')"
          if [ "$actual" != "$expected" ]; then
            printf '[error] staged image archive hash mismatch\n' >&2
            exit 1
          fi
          printf '[ok] validated artifacts staged for upload\n'

      - name: Upload supply-chain image archive
        id: upload_image
        if: ${{ always() && steps.stage_artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.IMAGE_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/supply-chain-pr-artifacts/image/supply-chain-fixture.tar
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload supply-chain evidence
        id: upload_evidence
        if: ${{ always() && steps.stage_artifacts.outcome == 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.EVIDENCE_ARTIFACT_NAME }}
          path: |
            ${{ runner.temp }}/supply-chain-pr-artifacts/evidence/artifact-sha256.txt
            ${{ runner.temp }}/supply-chain-pr-artifacts/evidence/runtime-source-archive-sha256.txt
            ${{ runner.temp }}/supply-chain-pr-artifacts/evidence/built-image-id.txt
            ${{ runner.temp }}/supply-chain-pr-artifacts/evidence/loaded-image-id.txt
            ${{ runner.temp }}/supply-chain-pr-artifacts/evidence/pre-load-image-removal.txt
            ${{ runner.temp }}/supply-chain-pr-artifacts/evidence/sbom-sha256.txt
            ${{ runner.temp }}/supply-chain-pr-artifacts/evidence/sbom-syft-sha256.txt
            ${{ runner.temp }}/supply-chain-pr-artifacts/evidence/vulnerabilities-sha256.txt
            ${{ runner.temp }}/supply-chain-pr-artifacts/evidence/sbom.cdx.json
            ${{ runner.temp }}/supply-chain-pr-artifacts/evidence/sbom.syft.json
            ${{ runner.temp }}/supply-chain-pr-artifacts/evidence/vulnerabilities.json
            ${{ runner.temp }}/supply-chain-pr-artifacts/evidence/policy-result.json
            ${{ runner.temp }}/supply-chain-pr-artifacts/evidence/evidence-manifest.json
            ${{ runner.temp }}/supply-chain-pr-artifacts/evidence/evidence-manifest.json.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Summarize supply-chain evidence
        if: ${{ always() }}
        run: |
          {
            printf '## Supply-chain PR evidence\n\n'
            printf '%s\n' "- Source revision: \`$SOURCE_REVISION\`"
            printf '%s\n' "- PR base SHA: \`$PR_BASE_SHA\`"
            printf '%s\n' "- PR head SHA: \`$PR_HEAD_SHA\`"
            printf '%s\n' "- PR merge SHA: \`$PR_MERGE_SHA\`"
            if [ -f "$EVIDENCE_DIR/artifact-sha256.txt" ]; then
              printf '%s\n' "- Archive SHA-256: \`$(cat "$EVIDENCE_DIR/artifact-sha256.txt")\`"
            fi
            if [ -f "$EVIDENCE_DIR/policy-result.json" ]; then
              ruby -rjson -e '
                data = JSON.parse(File.read(ARGV.fetch(0)))
                counts = data.fetch("counts_by_severity", {})
                puts "- Policy result: `#{data.fetch("decision")}`"
                puts "- Vulnerability counts: `#{counts}`"
              ' "$EVIDENCE_DIR/policy-result.json"
            fi
            printf '%s\n' "- Evidence validation: \`${{ steps.evidence_validation.outputs.validated }}\`"
            printf '%s\n' "- Image artifact: \`$IMAGE_ARTIFACT_NAME\`"
            printf '%s\n' "- Evidence artifact: \`$EVIDENCE_ARTIFACT_NAME\`"
            if [ -n "${{ steps.upload_image.outputs.artifact-digest }}" ]; then
              printf '%s\n' "- Image artifact digest: \`${{ steps.upload_image.outputs.artifact-digest }}\`"
            fi
            if [ -n "${{ steps.upload_evidence.outputs.artifact-digest }}" ]; then
              printf '%s\n' "- Evidence artifact digest: \`${{ steps.upload_evidence.outputs.artifact-digest }}\`"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Enforce supply-chain evidence result
        if: ${{ always() }}
        env:
          EVIDENCE_RUN_OUTCOME: ${{ steps.evidence_run.outcome }}
          EVIDENCE_VALIDATED: ${{ steps.evidence_validation.outputs.validated }}
          SIZE_GUARD_OUTCOME: ${{ steps.size_guard.outcome }}
          STAGE_ARTIFACTS_OUTCOME: ${{ steps.stage_artifacts.outcome }}
          IMAGE_UPLOAD_OUTCOME: ${{ steps.upload_image.outcome }}
          EVIDENCE_UPLOAD_OUTCOME: ${{ steps.upload_evidence.outcome }}
        run: |
          failed=false

          if [ "$EVIDENCE_VALIDATED" != "true" ]; then
            printf '[error] complete validated evidence is not available\n' >&2
            failed=true
          fi
          if [ "$SIZE_GUARD_OUTCOME" != "success" ]; then
            printf '[error] artifact size guard result: %s\n' "$SIZE_GUARD_OUTCOME" >&2
            failed=true
          fi
          if [ "$STAGE_ARTIFACTS_OUTCOME" != "success" ]; then
            printf '[error] artifact staging result: %s\n' "$STAGE_ARTIFACTS_OUTCOME" >&2
            failed=true
          fi
          if [ "$IMAGE_UPLOAD_OUTCOME" != "success" ]; then
            printf '[error] image artifact upload result: %s\n' "$IMAGE_UPLOAD_OUTCOME" >&2
            failed=true
          fi
          if [ "$EVIDENCE_UPLOAD_OUTCOME" != "success" ]; then
            printf '[error] evidence artifact upload result: %s\n' "$EVIDENCE_UPLOAD_OUTCOME" >&2
            failed=true
          fi
          if [ "$EVIDENCE_RUN_OUTCOME" != "success" ]; then
            printf '[error] supply-chain evidence result: %s\n' "$EVIDENCE_RUN_OUTCOME" >&2
            failed=true
          fi

          if [ "$failed" = "true" ]; then
            exit 1
          fi
          printf '[ok] supply-chain PR evidence succeeded and was retained\n'

  supply-chain-pr-validation:
    name: Supply-chain PR validation
    needs:
      - scope
      - supply-chain-pr-execution
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Evaluate supply-chain PR result
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUN_RUNTIME: ${{ needs.scope.outputs.run-runtime }}
          RUNTIME_RESULT: ${{ needs.supply-chain-pr-execution.result }}
        run: |
          if [ "$SCOPE_RESULT" != "success" ]; then
            printf '[error] Supply-chain PR scope detection failed with result: %s\n' "$SCOPE_RESULT" >&2
            exit 1
          fi

          case "$RUN_RUNTIME:$RUNTIME_RESULT" in
            true:success)
              printf '[ok] Supply-chain PR execution succeeded for relevant changes.\n'
              ;;
            true:failure | true:cancelled | true:skipped)
              printf '[error] Supply-chain PR execution result for relevant changes: %s\n' "$RUNTIME_RESULT" >&2
              exit 1
              ;;
            false:skipped)
              printf '[ok] Supply-chain PR execution intentionally skipped for irrelevant changes.\n'
              ;;
            false:success)
              printf '[ok] Supply-chain PR execution succeeded although scope was not relevant.\n'
              ;;
            *)
              printf '[error] Unexpected Supply-chain PR gate state: scope=%s runtime=%s run-runtime=%s\n' "$SCOPE_RESULT" "$RUNTIME_RESULT" "$RUN_RUNTIME" >&2
              exit 1
              ;;
          esac
