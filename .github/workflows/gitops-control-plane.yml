name: GitOps Control Plane

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    name: Argo CD reconciliation scope
    runs-on: ubuntu-24.04
    outputs:
      run-runtime: ${{ steps.classify.outputs.run-runtime }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Classify Argo CD reconciliation scope
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            printf 'run-runtime=true\n' >>"$GITHUB_OUTPUT"
            printf '[info] Non-PR event; Argo CD reconciliation execution required.\n'
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" >"$RUNNER_TEMP/changed-files.txt"
          run_runtime="$(scripts/ci/workflow-scope.sh gitops "$RUNNER_TEMP/changed-files.txt")"
          printf 'run-runtime=%s\n' "$run_runtime" >>"$GITHUB_OUTPUT"
          printf '[info] Argo CD reconciliation execution required: %s\n' "$run_runtime"

  argocd-reconciliation-execution:
    name: Argo CD reconciliation execution
    needs: scope
    if: ${{ needs.scope.outputs.run-runtime == 'true' }}
    runs-on: ubuntu-24.04
    env:
      GITOPS_TEST_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.GITOPS_TEST_REVISION }}

      - name: Install pinned Kubernetes tools
        run: bash scripts/ci/install-local-kubernetes-tools.sh

      - name: Create local Kubernetes cluster
        run: make cluster-create

      - name: Validate local Kubernetes cluster
        run: make cluster-validate

      - name: Install Argo CD control plane
        run: make gitops-install

      - name: Bootstrap GitOps Application at tested commit
        env:
          GITOPS_TARGET_REVISION: ${{ env.GITOPS_TEST_REVISION }}
        run: make gitops-bootstrap

      - name: Validate GitOps control plane
        run: make gitops-validate

      - name: Prove reconciliation and self-healing
        run: make gitops-test-reconciliation

      - name: Remove GitOps state
        run: make gitops-delete

      - name: Confirm Kind cluster remains healthy
        run: make cluster-validate

      - name: Reinstall Argo CD control plane
        run: make gitops-install

      - name: Rebootstrap GitOps Application at tested commit
        env:
          GITOPS_TARGET_REVISION: ${{ env.GITOPS_TEST_REVISION }}
        run: make gitops-bootstrap

      - name: Validate reinstalled GitOps state
        run: make gitops-validate

      - name: Clean up GitOps state
        if: always()
        run: make gitops-delete

      - name: Delete local Kubernetes cluster
        if: always()
        run: make cluster-delete

  argocd-reconciliation-validation:
    name: Argo CD reconciliation validation
    needs:
      - scope
      - argocd-reconciliation-execution
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Evaluate Argo CD reconciliation result
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUN_RUNTIME: ${{ needs.scope.outputs.run-runtime }}
          RUNTIME_RESULT: ${{ needs.argocd-reconciliation-execution.result }}
        run: |
          if [ "$SCOPE_RESULT" != "success" ]; then
            printf '[error] Argo CD scope detection failed with result: %s\n' "$SCOPE_RESULT" >&2
            exit 1
          fi

          case "$RUN_RUNTIME:$RUNTIME_RESULT" in
            true:success)
              printf '[ok] Argo CD reconciliation execution succeeded for relevant changes.\n'
              ;;
            true:failure | true:cancelled | true:skipped)
              printf '[error] Argo CD reconciliation execution result for relevant changes: %s\n' "$RUNTIME_RESULT" >&2
              exit 1
              ;;
            false:skipped)
              printf '[ok] Argo CD reconciliation execution intentionally skipped for irrelevant changes.\n'
              ;;
            false:success)
              printf '[ok] Argo CD reconciliation execution succeeded although scope was not relevant.\n'
              ;;
            *)
              printf '[error] Unexpected Argo CD gate state: scope=%s runtime=%s run-runtime=%s\n' "$SCOPE_RESULT" "$RUNTIME_RESULT" "$RUN_RUNTIME" >&2
              exit 1
              ;;
          esac
