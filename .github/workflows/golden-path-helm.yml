name: Golden Path Helm

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    name: Helm chart and GitOps scope
    runs-on: ubuntu-24.04
    outputs:
      run-runtime: ${{ steps.classify.outputs.run-runtime }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Classify Helm chart and GitOps scope
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            printf 'run-runtime=true\n' >>"$GITHUB_OUTPUT"
            printf '[info] Non-PR event; Helm chart and GitOps execution required.\n'
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" >"$RUNNER_TEMP/changed-files.txt"
          run_runtime="$(scripts/ci/workflow-scope.sh golden-path "$RUNNER_TEMP/changed-files.txt")"
          printf 'run-runtime=%s\n' "$run_runtime" >>"$GITHUB_OUTPUT"
          printf '[info] Helm chart and GitOps execution required: %s\n' "$run_runtime"

  helm-chart-and-gitops-execution:
    name: Helm chart and GitOps execution
    needs: scope
    if: ${{ needs.scope.outputs.run-runtime == 'true' }}
    runs-on: ubuntu-24.04
    env:
      GOLDEN_PATH_TEST_REVISION: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.GOLDEN_PATH_TEST_REVISION }}

      - name: Install pinned Helm validation tools
        run: bash scripts/ci/install-helm-tools.sh

      - name: Validate golden-path chart statically
        run: make helm-validate

      - name: Install pinned Kubernetes tools
        run: bash scripts/ci/install-local-kubernetes-tools.sh

      - name: Create local Kubernetes cluster
        run: make cluster-create

      - name: Server-side dry-run runtime chart render
        run: make helm-server-dry-run

      - name: Install Argo CD control plane
        run: make gitops-install

      - name: Bootstrap platform GitOps at tested commit
        env:
          GITOPS_TARGET_REVISION: ${{ env.GOLDEN_PATH_TEST_REVISION }}
        run: make gitops-bootstrap

      - name: Bootstrap golden-path app through Argo CD
        env:
          GOLDEN_PATH_TARGET_REVISION: ${{ env.GOLDEN_PATH_TEST_REVISION }}
        run: make golden-path-bootstrap

      - name: Validate golden-path runtime
        run: make golden-path-validate

      - name: Delete golden-path runtime state
        run: make golden-path-delete

      - name: Rebootstrap golden-path app through Argo CD
        env:
          GOLDEN_PATH_TARGET_REVISION: ${{ env.GOLDEN_PATH_TEST_REVISION }}
        run: make golden-path-bootstrap

      - name: Validate re-created golden-path runtime
        run: make golden-path-validate

      - name: Clean up golden-path runtime
        if: always()
        run: make golden-path-delete

      - name: Clean up GitOps state
        if: always()
        run: make gitops-delete

      - name: Delete local Kubernetes cluster
        if: always()
        run: make cluster-delete

  helm-chart-and-gitops-validation:
    name: Helm chart and GitOps validation
    needs:
      - scope
      - helm-chart-and-gitops-execution
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Evaluate Helm chart and GitOps result
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUN_RUNTIME: ${{ needs.scope.outputs.run-runtime }}
          RUNTIME_RESULT: ${{ needs.helm-chart-and-gitops-execution.result }}
        run: |
          if [ "$SCOPE_RESULT" != "success" ]; then
            printf '[error] Helm chart scope detection failed with result: %s\n' "$SCOPE_RESULT" >&2
            exit 1
          fi

          case "$RUN_RUNTIME:$RUNTIME_RESULT" in
            true:success)
              printf '[ok] Helm chart and GitOps execution succeeded for relevant changes.\n'
              ;;
            true:failure | true:cancelled | true:skipped)
              printf '[error] Helm chart and GitOps execution result for relevant changes: %s\n' "$RUNTIME_RESULT" >&2
              exit 1
              ;;
            false:skipped)
              printf '[ok] Helm chart and GitOps execution intentionally skipped for irrelevant changes.\n'
              ;;
            false:success)
              printf '[ok] Helm chart and GitOps execution succeeded although scope was not relevant.\n'
              ;;
            *)
              printf '[error] Unexpected Helm chart gate state: scope=%s runtime=%s run-runtime=%s\n' "$SCOPE_RESULT" "$RUNTIME_RESULT" "$RUN_RUNTIME" >&2
              exit 1
              ;;
          esac
