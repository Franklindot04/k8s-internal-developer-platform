name: Local Kubernetes Foundation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    name: Kind lifecycle scope
    runs-on: ubuntu-24.04
    outputs:
      run-runtime: ${{ steps.classify.outputs.run-runtime }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Classify Kind lifecycle scope
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ]; then
            printf 'run-runtime=true\n' >>"$GITHUB_OUTPUT"
            printf '[info] Non-PR event; Kind lifecycle execution required.\n'
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" >"$RUNNER_TEMP/changed-files.txt"
          run_runtime="$(scripts/ci/workflow-scope.sh kind "$RUNNER_TEMP/changed-files.txt")"
          printf 'run-runtime=%s\n' "$run_runtime" >>"$GITHUB_OUTPUT"
          printf '[info] Kind lifecycle execution required: %s\n' "$run_runtime"

  kind-lifecycle-execution:
    name: Kind lifecycle execution
    needs: scope
    if: ${{ needs.scope.outputs.run-runtime == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Install pinned Kubernetes tools
        run: bash scripts/ci/install-local-kubernetes-tools.sh

      - name: Verify cluster tools
        run: make verify-cluster-tools

      - name: Create local Kubernetes cluster
        run: make cluster-create

      - name: Validate local Kubernetes cluster
        run: make cluster-validate

      - name: Show cluster status
        run: make cluster-status

      - name: Delete local Kubernetes cluster before recreation
        run: make cluster-delete

      - name: Recreate local Kubernetes cluster
        run: make cluster-create

      - name: Validate recreated local Kubernetes cluster
        run: make cluster-validate

      - name: Delete local Kubernetes cluster after validation
        if: always()
        run: make cluster-delete

  kind-lifecycle-validation:
    name: Kind lifecycle validation
    needs:
      - scope
      - kind-lifecycle-execution
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Evaluate Kind lifecycle result
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          RUN_RUNTIME: ${{ needs.scope.outputs.run-runtime }}
          RUNTIME_RESULT: ${{ needs.kind-lifecycle-execution.result }}
        run: |
          if [ "$SCOPE_RESULT" != "success" ]; then
            printf '[error] Kind scope detection failed with result: %s\n' "$SCOPE_RESULT" >&2
            exit 1
          fi

          case "$RUN_RUNTIME:$RUNTIME_RESULT" in
            true:success)
              printf '[ok] Kind lifecycle execution succeeded for relevant changes.\n'
              ;;
            true:failure | true:cancelled | true:skipped)
              printf '[error] Kind lifecycle execution result for relevant changes: %s\n' "$RUNTIME_RESULT" >&2
              exit 1
              ;;
            false:skipped)
              printf '[ok] Kind lifecycle execution intentionally skipped for irrelevant changes.\n'
              ;;
            false:success)
              printf '[ok] Kind lifecycle execution succeeded although scope was not relevant.\n'
              ;;
            *)
              printf '[error] Unexpected Kind gate state: scope=%s runtime=%s run-runtime=%s\n' "$SCOPE_RESULT" "$RUNTIME_RESULT" "$RUN_RUNTIME" >&2
              exit 1
              ;;
          esac
